name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun test tests/
      - name: Build all browsers
        run: bun run build:all
      - name: Release gate (manifests, permissions, CSP, forbidden files)
        run: bun scripts/verify-release.ts
      - name: Size budget
        run: bun run scripts/size-budget.ts
      - name: Package zips
        run: bun run zip:all
      - name: Lint Firefox package
        run: bunx --bun web-ext lint --source-dir .output/firefox-mv2 --warnings-as-errors=false
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Advisory (not a gate): today's 'high' hits are adm-zip, a WXT build-time
      # dep that never ships. Flip to blocking once upstream is patched.
      - run: bun audit --prod --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ner-model
          key: ner-model-263e82c
      - run: bun run fetch:ner --model
      - run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
